[project]
name = "murmur"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Korouhanba", email = "laikhuramkorouhanba@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.37.0",
    "pynput>=1.8.2",
    "python-dotenv>=1.2.4",
    "rumps>=0.4.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
murmur = "murmur:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
